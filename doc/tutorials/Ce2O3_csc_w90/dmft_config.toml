[general]
seedname = "ce2o3"
jobname = "b10-U6.46-J0.46"
csc = true

eta = 0.5
n_iw = 100
n_tau = 5001

n_iter_dmft_first = 2
n_iter_dmft_per = 1
n_iter_dmft = 5

enforce_off_diag = false
block_threshold = 1e-03

h_int_type = "density_density"
h_int_basis = "triqs"
U = 6.46
J = 0.46
beta = 10
prec_mu = 0.1

sigma_mix = 1.0
g0_mix = 1.0
dc_type = 0
dc = true
dc_dmft = true
calc_energies = true

h5_save_freq = 1
store_solver = false

[solver]
type = "hubbardI"
n_l = 15
measure_G_l = false
measure_density_matrix = true

[dft]
dft_code = "qe"
n_cores = 10
mpi_env = "default"
mpi_exe = "mpirun"
projector_type = "w90"
w90_tolerance = 1e-1

[dft.dft_exec]
path = '/path/to/q-e/bin'
pw = "pw.x -nk {number_cores}"
pw2wan = "pw2wannier90.x -nk 1 -pd .true."
bands = "bands.x -nk {number_cores}"
proj = "projwfc.x -nk {number_cores}"
win_pp = "wannier90.x -pp"
win = "wannier90.x"
