[general]
seedname = "vasp"
csc = true

n_iter_dmft_first = 2
n_iter_dmft_per = 1
n_iter_dmft = 10

block_threshold = 0.0001
enforce_off_diag = true
#set_rot = "hloc"

h_int_type = "kanamori"
h_int_basis = "vasp"
U = 8.0
J = 0.65
beta = 40
prec_mu = 0.0001

sigma_mix = 1.0
dc_type = 1
dc = true
dc_dmft = true
calc_energies = true

[solver]
type = "cthyb"
n_l = 35
length_cycle = 120
n_warmup_cycles = 10000
n_cycles_tot = 10e+6
imag_threshold = 1e-5
measure_G_l = true
measure_density_matrix = true

[dft]
dft_code = "vasp"
projector_type = "plo"
plo_cfg = "plo.cfg"
n_iter = 6
n_cores = 8
mpi_env = "default"
dft_exec = "vasp_std"
